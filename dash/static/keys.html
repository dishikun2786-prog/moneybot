<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>密钥与实盘 · moneybot</title>
<style>
:root{--bg:#121318;--card:#1a1b22;--bd:#2a2c36;--fg:#e8e9ee;--mut:#8b8e9c;--acc:#f7a600;--up:#3ebd93;--dn:#f6465d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px}
header{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--bd)}
header h1{font-size:17px;color:var(--acc)}
header a{margin-left:auto;color:var(--acc);text-decoration:none;font-size:13px;border:1px solid var(--bd);padding:6px 12px;border-radius:6px}
.wrap{max-width:860px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:18px}
.card h2{font-size:15px;margin-bottom:6px}
.card .sub{color:var(--mut);font-size:12px;margin-bottom:14px}
.status{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--bd);border-radius:8px;margin-top:10px}
.status .dot{width:9px;height:9px;border-radius:50%;background:#555}
.status.ok .dot{background:var(--up)}.status.bad .dot{background:var(--dn)}
.status .info{flex:1;font-size:13px}
.warnbox{background:#3a2a10;border:1px solid #5a4520;color:#f7a600;border-radius:8px;padding:10px 12px;font-size:12px;margin-top:10px;line-height:1.6}
.limits{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.lim{background:#16171d;border:1px solid var(--bd);border-radius:8px;padding:10px 12px}
.lim .n{font-size:16px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.lim .l{font-size:11px;color:var(--mut)}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#1e2028;border:1px solid var(--bd);border-left:3px solid var(--acc);padding:10px 18px;border-radius:8px;display:none;z-index:99;font-size:13px}
</style>
</head>
<body>
<header>
  <h1>🔑 密钥与实盘</h1>
  <a href="/m">← 返回交易室</a><a href="/admin" id="k-adminlnk" style="display:none;color:#f7a600">管理后台</a>
</header>
<div class="wrap">
  <div class="card">
    <h2>我的实盘风控限额</h2>
    <div class="sub">由管理员配置，实盘下单前强制校验</div>
    <div class="limits" id="limbox"></div>
    <div class="warnbox" id="livewarn" style="display:none"></div>
  </div>

  <div class="card">
    <h2>交易密钥</h2>
    <div class="sub">平台统一密钥模式：所有用户的实盘下单、充值对账、提现打款均由平台统一密钥执行</div>
    <div class="status" id="pk-status"><span class="dot"></span><span class="info">加载中…</span></div>
    <div class="warnbox">密钥由<b>管理员在后台统一维护</b>（AES-256-GCM 加密存储）。你无需、也无法自行绑定任何交易所密钥；如需开通实盘交易权限，请联系管理员。</div>
  </div>
</div>
<div id="toast"></div>
<script>
function $(s){return document.querySelector(s)}
async function j(method,url){const r=await fetch(url,{method});return {s:r.status,d:await r.json().catch(()=>({}))}}
async function load(){
  try{
    const me=await j('GET','/api/auth/me');
    if(me.d&&me.d.user&&me.d.user.role==='admin')$('#k-adminlnk').style.display='';
  }catch(e){}
  const {d}=await j('GET','/api/keys');
  const lim=(d&&d.limits)||{};
  $('#limbox').innerHTML=
    '<div class="lim"><div class="l">单笔名义</div><div class="n">不限制(≤余额)</div></div>'
    +'<div class="lim"><div class="l">日累计名义</div><div class="n">不限制</div></div>'
    +'<div class="lim"><div class="l">最大持仓数</div><div class="n">不限制</div></div>'
    +'<div class="lim"><div class="l">实盘权限</div><div class="n">充值自动开通·额度=余额'+'</div></div>';
  // R14-M15: 充值自动开通 — 旧警告下线
  try{
    const lv=await j('GET','/api/live/status');
    const st=lv.d&&lv.d.data&&lv.d.data.live_enabled;
    if(st){$('#pk-status').className='status ok';$('#pk-status').innerHTML='<span class="dot"></span><span class="info">✅ 实盘已开通 — 平台统一密钥执行</span>'}
    else{$('#pk-status').className='status';$('#pk-status').innerHTML='<span class="dot"></span><span class="info">实盘未开通（模拟交易）— 联系管理员开通后，由平台统一密钥执行</span>'}
  }catch(e){$('#pk-status').innerHTML='<span class="dot"></span><span class="info">状态加载失败</span>'}
}
load();
</script>
</body>
</html>
