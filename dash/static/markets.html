<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>标的监控 · Moneybot</title>
<link rel="stylesheet" href="/static/style.css">
</head><body>
<nav><a class="brand" href="/">💰 Moneybot</a>
<a href="/">总览</a><a href="/trade">交易室</a><a href="/markets" class="active">标的监控</a><a href="/carry">套利监控</a><a href="/edge">错价分析</a>
<a href="/pnl">盈亏看板</a><a href="/analysis">分析报告</a><a href="/system">系统</a>
<span class="clock" id="clock"></span></nav>
<main>
<h1>对冲标的监控 <small>119个碰价期权桶 · 模型价 vs 市场价 · 点击行看详情 · 10秒刷新</small></h1>
<div class="toolbar">
  <select id="sort" onchange="refresh()">
    <option value="edge">按 价差 排序</option>
    <option value="bias">按 模型偏差 排序</option>
    <option value="strike">按 行权价 排序</option>
  </select>
  <input id="q" placeholder="过滤 (比特币/以太坊/2,000...)" oninput="refresh()">
  <span class="dim" id="info"></span>
</div>
<div class="panel" style="overflow-x:auto">
<table id="mtbl"><thead><tr>
<th>标的</th><th>方向</th><th>行权价</th><th>现货</th><th>模型价</th>
<th>买价</th><th>卖价</th><th>买价差¢</th><th>卖价差¢</th><th>波动率比</th><th>到期参考</th>
</tr></thead><tbody></tbody></table>
</div>
<div class="footer">moneybot.openedskill.com · 点击行进入错价分析</div>
</main>
<script src="/static/app.js"></script>
<script>
startClock('clock');
async function refresh(){
  const sort = document.getElementById('sort').value;
  const q = document.getElementById('q').value;
  const r = await fetch('/api/markets?sort='+sort+'&q='+encodeURIComponent(q));
  if(r.status===401){ location.href='/login'; return; }
  const d = await r.json();
  document.getElementById('info').innerHTML = d.n + ' 个标的 · ' + freshnessHtml(d.rows && d.rows.length ? d.rows[0].ts : null);
  const tb = document.querySelector('#mtbl tbody');
  tb.innerHTML = '';
  for(const m of d.rows){
    const ivr = (m.iv>0 && m.pm_impl_sigma) ? (m.pm_impl_sigma/m.iv).toFixed(3) : '—';
    const key = encodeURIComponent(m.event + '|' + m.market);
    const tr = document.createElement('tr');
    tr.onclick = ()=>location.href='/edge?k='+key;
    tr.innerHTML = `<td>${m.market_zh.slice(0,40)}</td><td>${m.dir_zh}</td>
      <td>${Number(m.strike).toLocaleString()}</td>
      <td>${Number(m.spot).toFixed(0)}</td><td>${Number(m.model_p).toFixed(3)}</td>
      <td class="dim">${Number(m.best_bid).toFixed(3)}</td><td class="dim">${Number(m.best_ask).toFixed(3)}</td>
      <td class="${m.edge_buy_c>0?'pos':'dim'}">${m.edge_buy_c==null?'—':Number(m.edge_buy_c).toFixed(2)}</td>
      <td class="${m.edge_sell_c>0?'neg':'dim'}">${m.edge_sell_c==null?'—':Number(m.edge_sell_c).toFixed(2)}</td>
      <td class="dim">${ivr}</td><td class="dim">${m.deribit_exp||'—'}</td>`;
    tb.appendChild(tr);
  }
}
refresh(); setInterval(refresh, 10000);
</script>
</body></html>
