<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>系统 · Moneybot</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js"></script>
</head><body>
<nav><a class="brand" href="/">💰 Moneybot</a>
<a href="/">总览</a><a href="/markets">标的监控</a><a href="/carry">套利监控</a><a href="/edge">错价分析</a>
<a href="/pnl">盈亏看板</a><a href="/analysis">分析报告</a><a href="/system" class="active">系统</a>
<span class="clock" id="clock"></span></nav>
<main>
<h1>系统状态 <small>服务单元 + 看门狗 + 日志</small></h1>
<div class="panel"><h2>服务单元</h2>
<table id="systbl"><thead><tr><th>单元</th><th>类型</th><th>状态</th></tr></thead><tbody></tbody></table>
</div>
<div class="panel"><h2>修改登录密码</h2>
  <div class="toolbar">
    <input type="password" id="old_pw" placeholder="当前密码" autocomplete="current-password">
    <input type="password" id="new_pw" placeholder="新密码(至少8位)" autocomplete="new-password">
    <button onclick="changePw()">修改</button>
  </div>
  <div id="pw_msg" class="dim"></div>
</div>
<div class="panel"><h2>AI 操作记录（最近12条）</h2>
<table id="aitbl"><thead><tr><th>时间(UTC)</th><th>动作</th><th>摘要</th></tr></thead><tbody></tbody></table>
<p class="dim" style="font-size:11px;margin-top:6px">AI 助手全部操作留痕（预览/批准/拒绝/执行）· 变更类操作每个对应一个 git 版本可回退</p>
</div>
<div class="panel"><h2>看门狗状态</h2><pre id="wd">—</pre></div>
<div class="panel"><h2>WSS 日志尾部</h2><pre id="wsslog">—</pre></div>
<div class="panel"><h2>监控日志尾部</h2><pre id="monlog">—</pre></div>
<div class="footer">moneybot.openedskill.com</div>
</main>
<script>
startClock('clock');
async function refresh(){
  const r = await fetch('/api/system');
  if(r.status===401){ location.href='/login'; return; }
  const d = await r.json();
  const rows = [
    ['监控服务(预测市场)','常驻',d.units['pm-monitor']],
    ['行情流(秒级盘口)','常驻',d.units['pm-wss']],
    ['网页看板','常驻',d.units['pm-dash']],
    ['对冲检查','定时器(5分钟)',d.units['pm-hedge_timer']],
    ['数据平台写入','定时器(60秒)',d.units['pm-datawriter_timer']],
    ['健康看门狗','定时器(60秒)',d.units['pm-watchdog_timer']],
  ];
  document.querySelector('#systbl tbody').innerHTML = rows.map(([u,t,s])=>
    `<tr><td>${u}</td><td class="dim">${t}</td><td><span class="badge ${s==='active'?'ok':'bad'}">${s}</span></td></tr>`).join('');
  document.getElementById('wd').textContent = JSON.stringify(d.watchdog, null, 2);
  document.getElementById('wsslog').textContent = d.logs.wss || '(空)';
  document.getElementById('monlog').textContent = d.logs.monitor || '(空)';
  const at = d.ai_actions || [];
  document.querySelector('#aitbl tbody').innerHTML = at.map(a=>
    `<tr><td class="dim">${(a.ts||'').slice(11,19)}</td>
     <td><span class="badge ${a.action==='applied'?'ok':(a.action.includes('reject')?'bad':'')}">${a.action}</span></td>
     <td class="dim">${a.msg||''}</td></tr>`).join('')
    || '<tr><td class="dim" colspan="3">(无)</td></tr>';
}
async function changePw(){
  const old_pw = document.getElementById('old_pw').value;
  const new_pw = document.getElementById('new_pw').value;
  const r = await fetch('/api/password/change', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({old_pw: old_pw, new_pw: new_pw})});
  const d = await r.json().catch(()=>({}));
  const el = document.getElementById('pw_msg');
  if(d.ok){
    el.textContent = '✅ 已修改, 所有旧会话已吊销, 3秒后跳转登录页';
    document.getElementById('old_pw').value = document.getElementById('new_pw').value = '';
    setTimeout(()=>location.href='/login', 3000);
  } else {
    el.textContent = '❌ ' + (d.err || '修改失败');
  }
}
refresh(); setInterval(refresh, 10000);
</script>
</body></html>
