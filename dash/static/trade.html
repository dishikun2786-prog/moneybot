<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>交易室 · Moneybot</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/echarts.min.js"></script>
<script src="/static/app.js"></script>
<style>
:root{ --up:#f6465d; --down:#2ebd85; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0d1117;color:#e6edf3;font:13px/1.5 -apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{background:#1c2129;border:1px solid #2a313c;color:#e6edf3;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px}
button:hover{border-color:#3d4754}
button.on{background:rgba(0,200,83,.15);border-color:#00c853;color:#00c853}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}
.topbar{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid #2a313c;background:#161b22;flex-wrap:wrap;flex:0 0 auto}
.brand{font-weight:700;color:#00c853;font-size:14px;white-space:nowrap}
.sym{display:flex;align-items:baseline;gap:8px}
.sym b{font-size:16px;font-weight:700}
.ohlc{display:flex;gap:12px;color:#8b98a5;font-size:12px}
.ohlc b{color:#e6edf3;font-weight:600}
.spacer{flex:1}
.tf{display:flex;gap:2px;background:#1c2129;border:1px solid #2a313c;border-radius:6px;padding:2px}
.tf button{border:none;background:none;border-radius:4px}
.tf button.on{background:rgba(0,200,83,.18);color:#00c853}
.wrap{flex:1;display:grid;grid-template-columns:1fr 320px;grid-template-rows:1fr 220px;min-height:0}
.chartpane{grid-row:1;border-right:1px solid #2a313c;border-bottom:1px solid #2a313c;min-width:0;display:flex;flex-direction:column}
#chart{flex:1;min-height:0}
.legend{display:flex;gap:14px;padding:4px 12px;font-size:11px;color:#8b98a5;border-top:1px solid #2a313c;flex-wrap:wrap;background:#161b22}
.right{grid-row:1;grid-column:2;display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.tabs{display:flex;border-bottom:1px solid #2a313c;flex:0 0 auto;background:#161b22}
.tabs button{border:none;background:none;border-radius:0;padding:8px 14px;border-bottom:2px solid transparent}
.tabs button.on{border-bottom-color:#00c853;color:#00c853}
.tabbody{flex:1;overflow-y:auto;padding:10px 12px}
.posrow{border:1px solid #2a313c;border-radius:8px;background:#161b22;padding:9px 11px;margin-bottom:8px}
.posrow .h{display:flex;justify-content:space-between;font-size:12px}
.posrow .p{display:flex;justify-content:space-between;margin-top:5px;font-size:12px;color:#8b98a5}
.posrow .p b{color:#e6edf3}
.tag{font-size:10px;padding:1px 6px;border-radius:4px;border:1px solid #2a313c;color:#8b98a5}
.tag.zh1{color:#ffb300;border-color:rgba(255,179,0,.4)}
.tag.zh2{color:#4fc3f7;border-color:rgba(79,195,247,.4)}
.sigrow{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:1px solid #2a313c;font-size:12px}
.sigrow:last-child{border:none}
.sigrow .e{color:#8b98a5;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:175px}
.param-table{width:100%;font-size:12px;border-collapse:collapse;margin-top:6px}
.param-table td,.param-table th{padding:4px 6px;border-bottom:1px solid #1e242c;text-align:left}
.param-table th{color:#8b98a5;font-weight:600;font-size:11px}
.zhdesc{font-size:12px;color:#8b98a5;line-height:1.8;margin-bottom:8px}
.tapepane{grid-column:1/-1;display:flex;flex-direction:column;min-height:0;background:#161b22}
.tapehead{display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid #2a313c;flex:0 0 auto}
.tapehead h3{font-size:12px;color:#8b98a5;font-weight:600}
.fchips{display:flex;gap:4px}
.fchips button{padding:2px 9px;font-size:11px}
.tapebody{flex:1;overflow-y:auto;font-family:var(--mono);font-size:12px}
.tapebody table{width:100%;border-collapse:collapse}
.tapebody th{position:sticky;top:0;background:#161b22;color:#8b98a5;font-weight:600;font-size:11px;text-align:left;padding:5px 10px;border-bottom:1px solid #2a313c;z-index:2}
.tapebody td{padding:4px 10px;border-bottom:1px solid #1e242c;white-space:nowrap}
.tapebody tr{transition:background .8s}
.tapebody tr.flash{background:rgba(255,179,0,.16)}
.tapebody tr td:first-child{color:#8b98a5}
select{background:#1c2129;border:1px solid #2a313c;color:#e6edf3;border-radius:6px;padding:3px 6px}
@keyframes pulse{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
.livedot{width:8px;height:8px;border-radius:50%;background:#00c853;display:inline-block;animation:pulse 1.6s infinite}
.paused .livedot{background:#ffb300;animation:none}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr;grid-template-rows:1fr auto 200px}
  .right{grid-column:1;grid-row:2;max-height:220px;border-bottom:1px solid #2a313c}
  .chartpane{grid-row:1;border-right:none}
  .tapepane{grid-row:3}
}
</style>
</head><body>
<div class="topbar">
  <span class="brand">💰 Moneybot 交易室</span>
  <select id="sym" class="num">
    <option value="BTCUSDT">比特币永续 BTCUSDT</option>
    <option value="ETHUSDT">以太坊永续 ETHUSDT</option>
  </select>
  <div class="sym"><b class="num" id="price">—</b><span class="chg num" id="chg">—</span></div>
  <div class="ohlc">
    <span>开 <b class="num" id="st_o">—</b></span><span>高 <b class="num" id="st_h">—</b></span>
    <span>低 <b class="num" id="st_l">—</b></span><span>量 <b class="num" id="st_v">—</b></span>
  </div>
  <span class="spacer"></span>
  <div class="tf" id="tfbar">
    <button data-tf="1m">1m</button><button data-tf="5m">5m</button>
    <button data-tf="15m" class="on">15m</button><button data-tf="1h">1h</button>
    <button data-tf="4h">4h</button><button data-tf="D">日</button>
    <button data-tf="W">周</button><button data-tf="M">月</button>
  </div>
  <button id="conv" title="切换涨跌色惯例">红涨绿跌</button>
  <button id="play" class="on" title="空格键暂停/恢复">▶ 实时</button>
  <span class="clock2 num" id="clk" style="font-size:11px;color:#8b98a5;text-align:right;line-height:1.5"></span>
</div>

<div class="wrap">
  <div class="chartpane">
    <div id="chart"></div>
    <div class="legend">
      <span style="color:var(--up)">▲ 红涨</span><span style="color:var(--down)">▼ 绿跌</span>
      <span style="color:#4fc3f7">━ MA7</span><span style="color:#b388ff">━ MA25</span>
      <span style="margin-left:auto">真实数据 · 每60秒更新末根 · 滚轮缩放/拖拽平移 · 空格暂停</span>
    </div>
  </div>

  <div class="right">
    <div class="tabs">
      <button class="on" data-tab="pos">持仓</button>
      <button data-tab="strat">策略</button>
      <button data-tab="sig">信号</button>
    </div>
    <div class="tabbody" id="tab-pos"></div>
    <div class="tabbody" id="tab-strat" style="display:none"></div>
    <div class="tabbody" id="tab-sig" style="display:none"></div>
  </div>

  <div class="tapepane">
    <div class="tapehead">
      <h3>实时成交带（两引擎全部交易）</h3>
      <div class="fchips" id="fchips">
        <button class="on" data-f="all">全部</button>
        <button data-f="预测市场">预测市场</button>
        <button data-f="现货套利">现货套利</button>
      </div>
      <span class="spacer" style="flex:1"></span>
      <span class="livedot"></span>
    </div>
    <div class="tapebody"><table id="tape"></table></div>
  </div>
</div>
<script>
let sym='BTCUSDT', tf='15m', conv='cn', playing=true;
let chart=null, lastTapeKey='';
const CONV={cn:{up:'#f6465d',down:'#2ebd85',label:'红涨绿跌'},intl:{up:'#2ebd85',down:'#f6465d',label:'绿涨红跌'}};
const TF_LIMIT={ '1m':240, '5m':240, '15m':200, '1h':160, '4h':120, 'D':200, 'W':150, 'M':80 };
const id=(s)=>document.getElementById(s);
startClock('clk');

async function guard(url){
  const r = await fetch(url);
  if(r.status===401){ location.href='/login'; return null; }
  return r.json();
}
function fmtT(ms){
  const d=new Date(ms), p=n=>String(n).padStart(2,'0');
  if(tf==='1m'||tf==='5m') return `${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`;
  if(tf==='15m'||tf==='1h') return `${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`;
  if(tf==='4h') return `${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:00`;
  if(tf==='W'||tf==='D') return `${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())}`;
  return `${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}`;
}
function fmtV(v){ return v>=1e6?(v/1e6).toFixed(2)+'M':v>=1e3?(v/1e3).toFixed(1)+'K':String(v); }

async function loadKlines(){
  const d = await guard(`/api/klines?symbol=${sym}&interval=${tf}&limit=${TF_LIMIT[tf]}`);
  if(!d || !d.bars || !d.bars.length) return;
  const C = CONV[conv];
  const bars = d.bars;
  const ma = (win)=>{ const a=[];
    for(let i=0;i<bars.length;i++){ if(i<win-1){a.push(null);continue;}
      let s=0; for(let j=i-win+1;j<=i;j++) s+=bars[j].c; a.push(+(s/win).toFixed(1)); } return a; };
  chart = chart || echarts.init(id('chart'),'dark');
  chart.setOption({
    animation:false, backgroundColor:'transparent',
    axisPointer:{link:[{xAxisIndex:'all'}], label:{backgroundColor:'#2a313c'}},
    tooltip:{trigger:'axis', axisPointer:{type:'cross'}, backgroundColor:'#161b22', borderColor:'#2a313c',
      textStyle:{color:'#e6edf3',fontSize:12},
      formatter:function(ps){ const p=ps.find(x=>x.seriesType==='candlestick'); if(!p) return '';
        const i=p.dataIndex, b=bars[i]; const chg=((b.c-b.o)/b.o*100).toFixed(2);
        return `<div class="num">${fmtT(b.t)}</div>开 ${b.o} 高 ${b.h} 低 ${b.l} 收 <b class="${b.c>=b.o?'up':'down'}">${b.c}</b><br>涨跌 <b class="${b.c>=b.o?'up':'down'}">${chg}%</b> · 量 ${fmtV(b.v)}`; }},
    grid:[{left:56,right:16,top:18,height:'62%'},{left:56,right:16,top:'74%',height:'18%'}],
    xAxis:[{type:'category',data:bars.map(b=>fmtT(b.t)),gridIndex:0,axisLabel:{color:'#8b98a5',fontSize:10},axisLine:{lineStyle:{color:'#2a313c'}}},
           {type:'category',data:bars.map(b=>fmtT(b.t)),gridIndex:1,axisLabel:{show:false},axisLine:{lineStyle:{color:'#2a313c'}}}],
    yAxis:[{scale:true,gridIndex:0,position:'right',axisLabel:{color:'#8b98a5',fontSize:10},splitLine:{lineStyle:{color:'#1c2430'}}},
           {gridIndex:1,axisLabel:{show:false},splitLine:{show:false}}],
    dataZoom:[{type:'inside',xAxisIndex:[0,1],start:55,end:100,zoomOnMouseWheel:true,moveOnMouseMove:true},
              {type:'slider',xAxisIndex:[0,1],start:55,end:100,bottom:2,height:14,borderColor:'#2a313c',
               backgroundColor:'#161b22',fillerColor:'rgba(0,200,83,.12)',handleStyle:{color:'#00c853'},
               textStyle:{color:'#8b98a5',fontSize:9},showDetail:false}],
    series:[
      {name:'K线',type:'candlestick',data:bars.map(b=>[b.o,b.c,b.l,b.h]),
       itemStyle:{color:C.up,color0:C.down,borderColor:C.up,borderColor0:C.down},xAxisIndex:0,yAxisIndex:0},
      {name:'MA7',type:'line',data:ma(7),showSymbol:false,lineStyle:{width:1.2,color:'#4fc3f7'},xAxisIndex:0,yAxisIndex:0},
      {name:'MA25',type:'line',data:ma(25),showSymbol:false,lineStyle:{width:1.2,color:'#b388ff'},xAxisIndex:0,yAxisIndex:0},
      {name:'成交量',type:'bar',xAxisIndex:1,yAxisIndex:1,barMaxWidth:6,
       data:bars.map(b=>({value:b.v,itemStyle:{color:b.c>=b.o?C.up:C.down}}))}
    ]
  }, true);
  const last = bars[bars.length-1], prev = bars[bars.length-2];
  const chg = prev ? ((last.c-prev.c)/prev.c*100) : 0;
  id('price').textContent = last.c.toLocaleString();
  id('price').className = 'num '+(chg>=0?'up':'down');
  id('chg').textContent = (chg>=0?'+':'')+chg.toFixed(2)+'%';
  id('chg').className = 'chg num '+(chg>=0?'up':'down');
  id('st_o').textContent=last.o; id('st_h').textContent=last.h;
  id('st_l').textContent=last.l; id('st_v').textContent=fmtV(last.v);
}
async function loadPositions(){
  const d = await guard('/api/pnl'); if(!d) return;
  const rows = (d.positions||[]).map(p=>`<div class="posrow"><div class="h">
    <span><span class="tag ${p.strat==='预测市场对冲'?'zh1':'zh2'}">${p.strat}</span> ${p.key}</div>
    <b class="num">${p.side}</b></div>
    <div class="p"><span>入场 <b class="num">${p.entry}</b></span><span>${p.note}</span></div></div>`).join('');
  id('tab-pos').innerHTML = rows || '<p class="zhdesc">(空仓)</p>';
}
async function loadStrategy(){
  const d = await guard('/api/strategy'); if(!d) return;
  const order = [['carry','现货×永续套利'],['paper_pm','预测市场对冲'],['monitor','监控校准']];
  let html = '';
  for(const [k, name] of order){
    const p = (d.params||{})[k] || {};
    const zh = (d.zh||{})[k] || '';
    const pl = (d.params||{})[k] && d.params[k]._comment ? d.params[k]._comment : '';
    html += `<div style="margin-bottom:12px"><b>${name}</b><div class="zhdesc">${zh}</div>`;
    if(k !== 'monitor'){
      const labels = {theta_in_ann_pct:'入场阈值(年化%)',max_hold_h:'最长持仓(小时)',max_basis_bp:'基差上限(bp)',
        notional_usd:'每标的名义($)',min_gross_edge_c:'最小毛价差(¢)',theta_out_c:'平仓阈值(¢)',
        min_opposite_size:'对手档下限(股)',max_spread_c:'价差上限(¢)',max_exposure_usd:'总敞口上限($)',
        max_positions:'最大持仓数',max_daily_loss:'日亏限额($)'};
      html += '<table class="param-table"><tr><th>参数</th><th>当前值</th></tr>';
      for(const [pk, pv] of Object.entries(p)){
        html += `<tr><td>${labels[pk]||pk}</td><td class="num">${pv}</td></tr>`;
      }
      html += '</table>';
    } else {
      html += '<table class="param-table"><tr><th>参数</th><th>当前值</th></tr>';
      for(const [pk, pv] of Object.entries(p)){
        html += `<tr><td>${pk==='cal_sigma_up'?'σ校准·涨桶':(pk==='cal_sigma_down'?'σ校准·跌桶':pk)}</td><td class="num">${pv}</td></tr>`;
      }
      html += '</table>';
    }
    html += '</div>';
  }
  id('tab-strat').innerHTML = html + '<p class="zhdesc">参数单一源 strategy_params.json · AI助手修改后引擎下轮自动生效</p>';
}
async function loadSignals(){
  const c = await guard('/api/carry');
  let html = '';
  if(c && c.rows){
    for(const m of c.rows){
      const ann = Number(m.ann_pct);
      const ok = ann > 5 && Math.abs(m.basis_bp) < 20;
      html += `<div class="sigrow"><span class="e">${m.symbol_zh} 资金费率年化</span>
        <b class="num ${ann>0?'up':'down'}">${ann>0?'+':''}${ann.toFixed(1)}%</b> <span class="tag">${ok?'可入场':'等待'}</span></div>`;
      html += `<div class="sigrow"><span class="e">${m.symbol_zh} 基差</span>
        <b class="num">${m.basis_bp>0?'+':''}${Number(m.basis_bp).toFixed(1)}bp</b></div>`;
    }
  }
  const mk = await guard('/api/markets?sort=edge');
  if(mk && mk.rows){
    html += '<div style="font-size:11px;color:#8b98a5;margin:8px 0 2px">预测市场 最大价差 (top3)</div>';
    for(const m of mk.rows.slice(0,3)){
      const e = m.edge_buy_c!=null ? +m.edge_buy_c : -(m.edge_sell_c||0);
      html += `<div class="sigrow"><span class="e">${m.market_zh.slice(0,28)}</span>
        <b class="num ${e>0?'up':'down'}">${e>0?'买':'卖'}${Math.abs(e).toFixed(1)}¢</b></div>`;
    }
  }
  id('tab-sig').innerHTML = html || '<p class="zhdesc">(无数据)</p>';
}
let tapeRows = [];
async function loadTape(){
  const d = await guard('/api/tape?limit=60'); if(!d) return;
  const key = JSON.stringify(d).slice(0,200);
  const flash = key !== lastTapeKey; lastTapeKey = key;
  tapeRows = d;
  renderTape(flash);
}
function renderTape(flash){
  const f = document.querySelector('#fchips button.on').dataset.f;
  const rows = tapeRows.filter(r=> f==='all' || r.tag===f);
  const pcls = p => (p==null||p===undefined) ? '' : (Number(p)>0?'up':(Number(p)<0?'down':''));
  id('tape').innerHTML = `<thead><tr><th>时间(UTC)</th><th>策略</th><th>动作</th><th>标的</th><th>价格</th><th>盈亏</th><th>备注</th></tr></thead><tbody>` +
    rows.map((r,i)=>`<tr class="${flash&&i===0?'flash':''}">
      <td>${(r.ts||'').slice(11,19)}</td>
      <td><span class="tag ${r.tag==='预测市场'?'zh1':'zh2'}">${r.tag}</span></td>
      <td class="${r.action.includes('买')?'up':(r.action.includes('卖')?'down':'')}">${r.action}</td>
      <td>${r.symbol}</td><td class="num">${r.price??'—'}</td>
      <td class="num ${pcls(r.pnl)}">${r.pnl!=null ? (r.pnl>0?'+':'')+Number(r.pnl).toFixed(4) : '—'}</td>
      <td style="color:#8b98a5;font-size:11px">${r.note||''}</td></tr>`).join('') + '</tbody>';
}
id('sym').addEventListener('change', e=>{ sym=e.target.value; loadKlines(); });
id('tfbar').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#tfbar button').forEach(x=>x.classList.toggle('on',x===b));
  tf=b.dataset.tf; loadKlines(); });
id('conv').addEventListener('click', ()=>{ conv = conv==='cn'?'intl':'cn'; id('conv').textContent=CONV[conv].label; loadKlines(); });
id('play').addEventListener('click', ()=>{ playing=!playing; id('play').textContent = playing?'▶ 实时':'⏸ 暂停';
  id('play').className = playing?'on':''; document.body.classList.toggle('paused',!playing); });
id('fchips').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#fchips button').forEach(x=>x.classList.toggle('on',x===b)); renderTape(false); });
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click', ()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  ['pos','strat','sig'].forEach(t=>{ id('tab-'+t).style.display = b.dataset.tab===t?'':'none'; });
}));
document.addEventListener('keydown', e=>{ if(e.code==='Space'){ e.preventDefault();
  playing=!playing; id('play').textContent = playing?'▶ 实时':'⏸ 暂停'; document.body.classList.toggle('paused',!playing); } });

loadKlines(); loadPositions(); loadStrategy(); loadSignals(); loadTape();
setInterval(()=>{ if(playing) loadKlines(); }, 30000);
setInterval(()=>{ if(playing) loadTape(); }, 5000);
setInterval(()=>{ loadPositions(); loadSignals(); }, 15000);
window.addEventListener('resize', ()=>chart&&chart.resize());
</script>
</body></html>
