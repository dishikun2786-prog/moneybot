<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>交易室 · Moneybot</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/echarts.min.js"></script>
<script src="/static/app.js"></script>
<style>
:root{ --up:#f6465d; --down:#2ebd85; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0d1117;color:#e6edf3;font:13px/1.5 -apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{background:#1c2129;border:1px solid #2a313c;color:#e6edf3;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px}
button:hover{border-color:#3d4754}
button.on{background:rgba(0,200,83,.15);border-color:#00c853;color:#00c853}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}
.topbar{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid #2a313c;background:#161b22;flex-wrap:wrap;flex:0 0 auto}
.brand{font-weight:700;color:#00c853;font-size:14px;white-space:nowrap}
.sym{display:flex;align-items:baseline;gap:8px}
.sym b{font-size:16px;font-weight:700}
.ohlc{display:flex;gap:12px;color:#8b98a5;font-size:12px}
.ohlc b{color:#e6edf3;font-weight:600}
.spacer{flex:1}
.tf{display:flex;gap:2px;background:#1c2129;border:1px solid #2a313c;border-radius:6px;padding:2px}
.tf button{border:none;background:none;border-radius:4px}
.tf button.on{background:rgba(0,200,83,.18);color:#00c853}
.wrap{flex:1;display:grid;grid-template-columns:1fr 320px;grid-template-rows:1fr 220px;min-height:0}
.chartpane{grid-row:1;border-right:1px solid #2a313c;border-bottom:1px solid #2a313c;min-width:0;display:flex;flex-direction:column}
#chart{flex:1;min-height:0}
.legend{display:flex;gap:14px;padding:4px 12px;font-size:11px;color:#8b98a5;border-top:1px solid #2a313c;flex-wrap:wrap;background:#161b22}
.right{grid-row:1;grid-column:2;display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.tabs{display:flex;border-bottom:1px solid #2a313c;flex:0 0 auto;background:#161b22}
.tabs button{border:none;background:none;border-radius:0;padding:8px 14px;border-bottom:2px solid transparent}
.tabs button.on{border-bottom-color:#00c853;color:#00c853}
.tabbody{flex:1;overflow-y:auto;padding:10px 12px}
.posrow{border:1px solid #2a313c;border-radius:8px;background:#161b22;padding:9px 11px;margin-bottom:8px}
.posrow .h{display:flex;justify-content:space-between;font-size:12px}
.posrow .p{display:flex;justify-content:space-between;margin-top:5px;font-size:12px;color:#8b98a5}
.posrow .p b{color:#e6edf3}
.tag{font-size:10px;padding:1px 6px;border-radius:4px;border:1px solid #2a313c;color:#8b98a5}
.tag.zh1{color:#ffb300;border-color:rgba(255,179,0,.4)}
.tag.zh2{color:#4fc3f7;border-color:rgba(79,195,247,.4)}
.sigrow{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:1px solid #2a313c;font-size:12px}
.sigrow:last-child{border:none}
.sigrow .e{color:#8b98a5;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:175px}
.param-table{width:100%;font-size:12px;border-collapse:collapse;margin-top:6px}
.param-table td,.param-table th{padding:4px 6px;border-bottom:1px solid #1e242c;text-align:left}
.param-table th{color:#8b98a5;font-weight:600;font-size:11px}
.zhdesc{font-size:12px;color:#8b98a5;line-height:1.8;margin-bottom:8px}
.tapepane{grid-column:1/-1;display:flex;flex-direction:column;min-height:0;background:#161b22}
.tapehead{display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid #2a313c;flex:0 0 auto}
.tapehead h3{font-size:12px;color:#8b98a5;font-weight:600}
.fchips{display:flex;gap:4px}
.fchips button{padding:2px 9px;font-size:11px}
.tapebody{flex:1;overflow-y:auto;font-family:var(--mono);font-size:12px}
.tapebody table{width:100%;border-collapse:collapse}
.tapebody th{position:sticky;top:0;background:#161b22;color:#8b98a5;font-weight:600;font-size:11px;text-align:left;padding:5px 10px;border-bottom:1px solid #2a313c;z-index:2}
.tapebody td{padding:4px 10px;border-bottom:1px solid #1e242c;white-space:nowrap}
.tapebody tr{transition:background .8s}
.tapebody tr.flash{background:rgba(255,179,0,.16)}
.tapebody tr td:first-child{color:#8b98a5}
select{background:#1c2129;border:1px solid #2a313c;color:#e6edf3;border-radius:6px;padding:3px 6px}
.topnav{display:flex;gap:12px;font-size:12px}
.topnav a{color:#8b98a5;text-decoration:none}
.topnav a:hover{color:#00c853}
.livebox{display:inline-flex;align-items:center;gap:8px;margin-left:4px;padding:3px 10px;background:#0d1117;border:1px solid #2a313c;border-radius:7px}
/* 手动交易 UI */
.ticket{border:1px solid #2a313c;border-radius:8px;padding:10px;margin-bottom:10px;background:#0d1117}
.ticket .trow{display:flex;align-items:center;gap:8px;margin:6px 0}
.ticket select,.ticket input{background:#1c2129;border:1px solid #2a313c;color:#e6edf3;border-radius:6px;padding:6px 8px}
.abtn{font-size:11px;padding:6px 10px;border-radius:6px;cursor:pointer;border:1px solid #2a313c;background:#1c2129;color:#e6edf3}
.abtn:hover{border-color:#00c853}
.abtn.ok{background:rgba(0,200,83,.14);border-color:#00c853;color:#00c853}
.abtn.bad{background:rgba(255,82,82,.12);border-color:#ff5252;color:#ff5252}
.abtn.warn{background:rgba(255,179,0,.12);border-color:#ffb300;color:#ffb300}
.pbtns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pbtns .abtn{min-height:30px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;z-index:70}
.modal.open{display:flex}
.mbox{background:#161b22;border:1px solid #2a313c;border-radius:10px;padding:16px;width:400px;max-width:92vw;max-height:86vh;overflow:auto}
.mbox h3{margin:0 0 6px;font-size:15px}
.mbox label{display:block;font-size:12px;color:#8b98a5;margin:10px 0 4px}
.mbox input{width:100%;background:#0d1117;border:1px solid #2a313c;color:#e6edf3;border-radius:6px;padding:9px 10px;font-size:14px;box-sizing:border-box}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#161b22;border:1px solid #00c853;color:#e6edf3;padding:10px 18px;border-radius:8px;font-size:13px;z-index:80;display:none;max-width:86vw}
.toast.show{display:block;animation:pulse 2.4s}
/* 模式切换器 */
.modebar{border:1px solid #2a313c;border-radius:8px;padding:10px;margin-bottom:10px;background:#0d1117}
.moderow{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}
.mlabel{font-size:12px;color:#8b98a5;width:96px}
.modebtn{font-size:12px;padding:6px 12px;border-radius:20px;cursor:pointer;border:1px solid #2a313c;background:#1c2129;color:#8b98a5}
.modebtn.on{font-weight:600}
.modebtn.on[onclick*="auto"]{background:rgba(0,200,83,.16);border-color:#00c853;color:#00c853}
.modebtn.on[onclick*="manual"]{background:rgba(255,179,0,.16);border-color:#ffb300;color:#ffb300}
.mstatus{font-size:11px;margin-left:2px}
.mstatus.auto{color:#00c853}
.mstatus.manual{color:#ffb300}
#manual-banner{background:rgba(255,179,0,.12);border:1px solid #ffb300;color:#ffb300;font-size:12px;padding:7px 10px;border-radius:6px;margin-top:6px}
@media (max-width:768px){
  .topbar{flex-wrap:wrap;row-gap:6px}
  .topnav{order:5;width:100%;overflow-x:auto}
  .livebox{order:4}
  .mbox{position:fixed;bottom:10px;left:10px;right:10px;top:auto;width:auto;border-radius:14px 14px 8px 8px}
  .abtn{min-height:40px;font-size:12px}
  .modebtn{min-height:40px}
  .chatdrawer{width:100%;right:0;bottom:0;top:auto;height:70vh}
  .tapebody{overflow-x:auto}
  .ticket .trow{flex-wrap:wrap}
}
@keyframes pulse{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
.livedot{width:8px;height:8px;border-radius:50%;background:#00c853;display:inline-block;animation:pulse 1.6s infinite}
.paused .livedot{background:#ffb300;animation:none}
/* AI 聊天抽屉 */
.chatbtn{position:fixed;right:18px;bottom:18px;z-index:50;background:#161b22;border:1px solid #00c853;
  color:#00c853;border-radius:22px;padding:9px 16px;font-size:13px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.chatdrawer{position:fixed;right:12px;bottom:64px;z-index:51;width:380px;max-width:92vw;height:520px;max-height:75vh;
  background:#161b22;border:1px solid #2a313c;border-radius:12px;display:none;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.6)}
.chatdrawer.open{display:flex}
.chathead{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid #2a313c}
.chathead b{color:#00c853;font-size:13px}
.chathead .badge-ro{font-size:10px;color:#ffb300;border:1px solid rgba(255,179,0,.4);border-radius:4px;padding:1px 6px}
.chatbody{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:86%;padding:8px 11px;border-radius:10px;font-size:12.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:rgba(0,200,83,.13);border:1px solid rgba(0,200,83,.3)}
.msg.ai{align-self:flex-start;background:#1c2129;border:1px solid #2a313c}
.toolchip{align-self:flex-start;font-size:11px;color:#4fc3f7;border:1px dashed rgba(79,195,247,.4);
  border-radius:8px;padding:5px 9px;max-width:90%;overflow:hidden}
.toolchip .r{color:#8b98a5;font-size:10.5px;margin-top:2px;max-height:64px;overflow-y:auto}
.quick{display:flex;gap:5px;padding:7px 10px;flex-wrap:wrap;border-top:1px solid #2a313c}
.quick button{font-size:11px;padding:3px 9px}
.chatinput{display:flex;gap:6px;padding:8px 10px;border-top:1px solid #2a313c}
.chatinput input{flex:1;background:#0d1117;border:1px solid #2a313c;color:#e6edf3;border-radius:7px;padding:7px 10px;font-size:12.5px}
.cursor{display:inline-block;width:6px;height:13px;background:#00c853;animation:pulse 1s infinite;vertical-align:middle}
.apbtn{font-size:11px;padding:3px 10px;margin:6px 6px 0 0;border-radius:6px;cursor:pointer}
.apbtn.ok{background:rgba(0,200,83,.15);border:1px solid #00c853;color:#00c853}
.apbtn.no{background:rgba(255,82,82,.12);border:1px solid #ff5252;color:#ff5252}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr;grid-template-rows:1fr auto 200px}
  .right{grid-column:1;grid-row:2;max-height:220px;border-bottom:1px solid #2a313c}
  .chartpane{grid-row:1;border-right:none}
  .tapepane{grid-row:3}
}
</style>
</head><body>
<div class="topbar">
  <span class="brand">💰 Moneybot 交易室</span>
  <span class="topnav">
    <a href="/">总览</a><a href="/carry">套利监控</a><a href="/pnl">盈亏看板</a>

</div>

<div class="wrap">
  <div class="chartpane">
    <div id="chart"></div>
    <div class="legend">
      <span style="color:var(--up)">▲ 红涨</span><span style="color:var(--down)">▼ 绿跌</span>

</div>
<button class="chatbtn" onclick="toggleChat()">🤖 策略助手</button>

    <span style="flex:1"></span><button onclick="toggleChat()" style="border:none;background:none;color:#8b98a5;font-size:15px">✕</button></div>
  <div class="chatbody" id="chatbody"></div>
  <div class="quick" id="quickbar">
    <button data-q="系统现在运行正常吗？一句话总结">系统状态</button>

    <input type="number" step="0.1" id="tpslSl" class="num">
    <div class="pbtns">
      <button class="abtn warn" onclick="submitTpsl()">确认转裸仓（止盈止损随仓）</button>

    <h3 id="cfTitle">确认操作</h3>

      <button class="abtn bad" onclick="submitConfirm()">确认执行</button>
      <button class="abtn" onclick="closeModal('confirmModal')">取消</button>
    </div>

<script>
let sym='BTCUSDT', tf='15m', conv='cn', playing=true;
let chart=null, lastTapeKey='';
let klinesBars=null, candleData=null, posCache=null, lastLivePrices=null;
const CONV={cn:{up:'#f6465d',down:'#2ebd85',label:'红涨绿跌'},intl:{up:'#2ebd85',down:'#f6465d',label:'绿涨红跌'}};
const TF_LIMIT={ '1m':240, '5m':240, '15m':200, '1h':160, '4h':120, 'D':200, 'W':150, 'M':80 };
const id=(s)=>document.getElementById(s);
startClock('clk');

async function guard(url){
  const r = await fetch(url);
  if(r.status===401){ location.href='/login'; return null; }
  return r.json();
}
function fmtT(ms){
  const d=new Date(ms), p=n=>String(n).padStart(2,'0');
  // 本机时区渲染 (服务端存UTC, 前端自动换算 — 全球任意地区时间一致校对)
  if(tf==='1m'||tf==='5m') return `${p(d.getHours())}:${p(d.getMinutes())}`;
  if(tf==='15m'||tf==='1h') return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  if(tf==='4h') return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:00`;
  if(tf==='W'||tf==='D') return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  return `${d.getFullYear()}-${p(d.getMonth()+1)}`;
}
function fmtV(v){ return v>=1e6?(v/1e6).toFixed(2)+'M':v>=1e3?(v/1e3).toFixed(1)+'K':String(v); }

async function loadKlines(){
  const d = await guard(`/api/klines?symbol=${sym}&interval=${tf}&limit=${TF_LIMIT[tf]}`);
  if(!d || !d.bars || !d.bars.length) return;
  const C = CONV[conv];
  const bars = d.bars;
  klinesBars = bars;
  candleData = bars.map(b=>[b.o,b.c,b.l,b.h]);
  const ma = (win)=>{ const a=[];
    for(let i=0;i<bars.length;i++){ if(i<win-1){a.push(null);continue;}
      let s=0; for(let j=i-win+1;j<=i;j++) s+=bars[j].c; a.push(+(s/win).toFixed(1)); } return a; };
  chart = chart || echarts.init(id('chart'),'dark');
  chart.setOption({
    animation:false, backgroundColor:'transparent',
    axisPointer:{link:[{xAxisIndex:'all'}], label:{backgroundColor:'#2a313c'}},
    tooltip:{trigger:'axis', axisPointer:{type:'cross'}, backgroundColor:'#161b22', borderColor:'#2a313c',
      textStyle:{color:'#e6edf3',fontSize:12},
      formatter:function(ps){ const p=ps.find(x=>x.seriesType==='candlestick'); if(!p) return '';
        const i=p.dataIndex, b=bars[i]; const chg=((b.c-b.o)/b.o*100).toFixed(2);
        return `<div class="num">${fmtT(b.t)}</div>开 ${b.o} 高 ${b.h} 低 ${b.l} 收 <b class="${b.c>=b.o?'up':'down'}">${b.c}</b><br>涨跌 <b class="${b.c>=b.o?'up':'down'}">${chg}%</b> · 量 ${fmtV(b.v)}`; }},
    grid:[{left:56,right:16,top:18,height:'62%'},{left:56,right:16,top:'74%',height:'18%'}],
    xAxis:[{type:'category',data:bars.map(b=>fmtT(b.t)),gridIndex:0,axisLabel:{color:'#8b98a5',fontSize:10},axisLine:{lineStyle:{color:'#2a313c'}}},
           {type:'category',data:bars.map(b=>fmtT(b.t)),gridIndex:1,axisLabel:{show:false},axisLine:{lineStyle:{color:'#2a313c'}}}],
    yAxis:[{scale:true,gridIndex:0,position:'right',axisLabel:{color:'#8b98a5',fontSize:10},splitLine:{lineStyle:{color:'#1c2430'}}},
           {gridIndex:1,axisLabel:{show:false},splitLine:{show:false}}],
    dataZoom:[{type:'inside',xAxisIndex:[0,1],start:55,end:100,zoomOnMouseWheel:true,moveOnMouseMove:true},
              {type:'slider',xAxisIndex:[0,1],start:55,end:100,bottom:2,height:14,borderColor:'#2a313c',

function renderPositions(d, live){
  const lp = live || {};
  if(!document.getElementById('pos-list')) initTicket();
  const rows = (d.positions||[]).map(p=>{
    let u = null;
    if(p.live && lp[p.live.symbol]){
      const n = p.live.notional;
      if(p.live.naked){
        const L = Number(lp[p.live.symbol].last);
        if(L) u = (p.live.perp_entry - L)/p.live.perp_entry * n;
      } else if(p.live.orphan){
        const S = Number(lp[p.live.symbol].spot);
        if(S) u = (S - p.live.spot_entry)/p.live.spot_entry * n;
      } else {
        const L = Number(lp[p.live.symbol].last);
        if(L) u = ((L - p.live.spot_entry)/p.live.spot_entry + (p.live.perp_entry - L)/p.live.perp_entry) * n;
      }
    }
    const uhtml = u==null ? '' : ` <b class="num ${u>0?'up':(u<0?'down':'')}" title="实时浮盈">${u>0?'+':''}${u.toFixed(3)}$</b>`;
    let btns = '';
    if(p.live && p.live.naked){
      btns = `<div class="pbtns">
        <button class="abtn" onclick="openTpslModal('${p.live.symbol}','${p.live.perp_entry}')">编辑止盈止损</button>

      btns = `<div class="pbtns">

/* ===== 实时行情 (Bybit WSS → SSE, 300ms节流) — 定义须在init调用之前 ===== */
let es = null, pxThrottle = 0;
function startES(){
  if(es) return;
  es = new EventSource('/api/stream/prices');
  es.onopen = () => { document.getElementById('livelag').textContent = '已连接'; };
  es.onmessage = e => {
    let d; try{ d = JSON.parse(e.data); }catch(err){ return; }
    const now = Date.now();
    if(now - pxThrottle < 300) return;
    pxThrottle = now;
    applyLive(d);
  };
  es.onerror = () => {
    es.close(); es = null;
    document.getElementById('livelag').textContent = '连接中断, 重连中…';
    setTimeout(startES, 5000);
  };
}
function applyLive(d){
  lastLivePrices = d.prices || {};
  const p = d.prices && d.prices[sym];
  if(!p || !p.last) return;
  const px = Number(p.last);
  // ① 实时价格盒
  const el = document.getElementById('livepx');
  el.textContent = px.toLocaleString('en-US', {maximumFractionDigits:2});
  const prev = Number(el.dataset.prev || px);
  el.style.color = px > prev ? '#ff5252' : (px < prev ? '#00c853' : '#e6edf3');
  el.dataset.prev = px;
  const chgEl = document.getElementById('livechg');
  const c = Number(p.change_pct || 0);
  chgEl.textContent = (c>0?'+':'') + c.toFixed(2) + '%';
  chgEl.style.color = c >= 0 ? '#ff5252' : '#00c853';
  document.getElementById('livelag').textContent = '延迟 ' + ((d.lag_ms||0)/1000).toFixed(1) + 's';
  // ② 价格大字 + 开高低量 + K线末根蜡烛
  if(klinesBars && klinesBars.length){
    const last = klinesBars[klinesBars.length-1];
    const prevBar = klinesBars[klinesBars.length-2];
    const chg2 = prevBar ? ((px-prevBar.c)/prevBar.c*100) : 0;
    id('price').textContent = px.toLocaleString();
    id('price').className = 'num '+(chg2>=0?'up':'down');
    id('chg').textContent = (chg2>=0?'+':'')+chg2.toFixed(2)+'%';
    id('chg').className = 'chg num '+(chg2>=0?'up':'down');
    id('st_h').textContent = Math.max(last.h, px);
    id('st_l').textContent = Math.min(last.l, px);
    last.c = px; last.h = Math.max(last.h, px); last.l = Math.min(last.l, px);
    candleData[candleData.length-1] = [last.o, last.c, last.l, last.h];
    if(chart && playing) chart.setOption({series:[{name:'K线', data: candleData}]});
  }
  // ③ 持仓实时浮盈
  if(posCache) renderPositions(posCache, lastLivePrices);
}

/* ===== AI 策略助手聊天 (SSE) ===== */
const chatMsgs = [];
function toggleChat(){ id('chatdrawer').classList.toggle('open'); }
function esc(s){ return String(s).replace(/[<>&]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }
function addMsg(role, text){
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.innerHTML = text;
  id('chatbody').appendChild(d);
  id('chatbody').scrollTop = 1e6;
  return d;
}
async function sendChat(text){
  const q = text || id('chatinput').value.trim();
  if(!q) return;
  id('chatinput').value = '';
  addMsg('user', esc(q));
  chatMsgs.push({role:'user', content:q});
  if(chatMsgs.length > 20) chatMsgs.splice(0, chatMsgs.length-20);
  const aiEl = addMsg('ai', '<span class="cursor"></span>');
  let acc = '';
  try{
    const r = await fetch('/api/ai/chat', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({messages: chatMsgs})});
    if(r.status===429){ aiEl.textContent = '请求太频繁，稍后再试'; return; }
    if(r.status===401){ location.href='/login'; return; }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for(const p of parts){
        const line = p.trim();
        if(!line.startsWith('data: ')) continue;
        let ev; try{ ev = JSON.parse(line.slice(6)); }catch(e){ continue; }
        if(ev.type==='delta'){
          acc += ev.text;
          aiEl.innerHTML = esc(acc) + '<span class="cursor"></span>';
          id('chatbody').scrollTop = 1e6;
        } else if(ev.type==='tool_call'){
          const chip = document.createElement('div');
          chip.className = 'toolchip';
          chip.innerHTML = '🔧 调用 ' + esc(ev.name);
          id('chatbody').appendChild(chip);
        } else if(ev.type==='tool_result'){
          const r = ev.result || {};
          if(r.status === 'preview'){
            const card = document.createElement('div');
            card.className = 'msg ai';
            const diffTxt = (r.diff||[]).map(d=>`${d.group}.${d.key}: ${d.old} → ${d.new}`).join('<br>')
              || esc(r.target || r.unit || '');
            card.innerHTML = `📋 <b>修改预览（待批准）</b><br>
              <span style="color:#8b98a5;font-size:11px">${diffTxt}</span><br>
              <button class="apbtn ok" data-id="${esc(r.action_id)}" data-ok="1">✅ 批准生效</button>
              <button class="apbtn no" data-id="${esc(r.action_id)}" data-ok="0">❌ 拒绝</button>`;
            id('chatbody').appendChild(card);
            card.querySelectorAll('.apbtn').forEach(b=>
              b.addEventListener('click', ()=>approveAction(b.dataset.id, b.dataset.ok==='1', card)));
            id('chatbody').scrollTop = 1e6;
          } else {
            const chips = id('chatbody').querySelectorAll('.toolchip');
            const c = chips[chips.length-1];
            if(c) c.innerHTML += `<div class="r">${esc(JSON.stringify(r).slice(0,280))}</div>`;
            id('chatbody').scrollTop = 1e6;
          }
        } else if(ev.type==='error'){
          aiEl.innerHTML = '⚠️ ' + esc(ev.text);
        }
      }
    }
    if(!acc && aiEl.innerHTML.includes('cursor')) aiEl.textContent = '(无内容)';
    chatMsgs.push({role:'assistant', content: acc});
    if(chatMsgs.length > 20) chatMsgs.splice(0, chatMsgs.length-20);
  }catch(e){
    aiEl.textContent = '连接失败: ' + e;
  }
}
id('quickbar').addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) sendChat(b.dataset.q); });
id('chatinput').addEventListener('keydown', e=>{ if(e.key==='Enter') sendChat(); });
async function approveAction(aid, ok, el){
  try{
    const r = await fetch('/api/ai/approve', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action_id: aid, approve: ok})});
    const d = await r.json();
    el.innerHTML = ok
      ? (d.ok ? `✅ <b>已生效</b>: ${esc(d.msg || '')}` : `⚠️ 执行失败: ${esc(d.error || '')}`)
      : '已拒绝（未执行）';
    loadStrategy();
  }catch(e){ el.textContent = '请求失败: ' + e; }
}
